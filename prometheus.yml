global:
  scrape_interval: 15s      # How often Prometheus scrapes targets
  evaluation_interval: 15s  # How often Prometheus evaluates alerting rules

scrape_configs:

  # ── .NET app (running on host) ─────────────────────────────────────────────
  # WHY host.docker.internal: the .NET app runs on the host (dotnet run), not
  # inside a container. host.docker.internal resolves to the host machine from
  # within a container on macOS and Windows. On Linux, add
  # --add-host=host.docker.internal:host-gateway to the prometheus service.
  - job_name: "otelsample-api"
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: /metrics

  # ── OTel Collector self-metrics (port 8888) ───────────────────────────────
  # The collector exposes its own internal metrics (memory, spans received, etc.)
  # Useful for diagnosing collector back-pressure and drop issues.
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]

  # ── OTel Collector pipeline metrics (port 8889) ────────────────────────────
  # Metrics received via OTLP and re-exported via the Prometheus exporter.
  # Port 8889 is distinct from self-metrics to avoid address conflicts.
  - job_name: "otel-collector-pipeline"
    static_configs:
      - targets: ["otel-collector:8889"]
