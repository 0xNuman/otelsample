---
# Local observability stack for OtelSample.
#
# Services:
#   sqlserver      — SQL Server 2022 (app database)
#   prometheus     — Prometheus scraping /metrics from the .NET app
#   grafana        — Grafana with pre-provisioned dashboard
#   otel-collector — OTel Collector (receives OTLP; useful for AWS mode testing locally)
#
# Run with:
#   podman compose up -d
#
# The .NET app runs on the host (dotnet run), NOT inside compose.
# Prometheus is configured to scrape host.docker.internal:5000/metrics.

services:

  # ── SQL Server ────────────────────────────────────────────────────────────
  # WHY azure-sql-edge on Apple Silicon (ARM64 / M-series Macs):
  #   mcr.microsoft.com/mssql/server:2022-latest is x86-64 only and segfaults
  #   under QEMU emulation on ARM64. azure-sql-edge ships a native ARM64 image
  #   and is fully compatible with SQL Server T-SQL for local development.
  #   On x86-64 Linux/Windows you can swap this back to mssql/server:2022-latest.
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: otelsample-sqlserver
    platform: linux/arm64
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Use a TCP-level check — azure-sql-edge does not ship sqlcmd, and
      # the TDS port (1433) being open is sufficient to know SQL Server is ready.
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/localhost/1433 && echo ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: otelsample-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - sqlserver

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: otelsample-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ── OTel Collector ────────────────────────────────────────────────────────
  # Useful for testing AWS mode locally: set Otel:Mode=aws in appsettings and
  # the app will push OTLP to this collector on port 4317.
  # In production, replace with the ADOT Collector sidecar on ECS.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otelsample-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector self-metrics (telemetry.metrics reader)
      - "8889:8889"   # Prometheus exporter for pipeline metrics
    depends_on:
      - prometheus

volumes:
  sqlserver-data:
  grafana-data:
