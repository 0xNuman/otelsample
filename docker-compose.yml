---
# Local observability stack for OtelSample.
#
# Services:
#   sqlserver      — SQL Server 2022 (app database)
#   prometheus     — Prometheus scraping /metrics from the .NET app
#   grafana        — Grafana with pre-provisioned dashboard
#   otel-collector — OTel Collector (receives OTLP; useful for AWS mode testing locally)
#
# Run with:
#   podman compose up -d
#
# The .NET app runs on the host (dotnet run), NOT inside compose.
# Prometheus is configured to scrape host.docker.internal:5000/metrics.

services:

  # ── SQL Server ────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: otelsample-sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: otelsample-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - sqlserver

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: otelsample-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ── OTel Collector ────────────────────────────────────────────────────────
  # Useful for testing AWS mode locally: set Otel:Mode=aws in appsettings and
  # the app will push OTLP to this collector on port 4317.
  # In production, replace with the ADOT Collector sidecar on ECS.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otelsample-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector's own Prometheus metrics
    depends_on:
      - prometheus

volumes:
  sqlserver-data:
  grafana-data:
