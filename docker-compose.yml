---
# Local observability stack for OtelSample.
#
# Services:
#   db-init        — one-shot container: creates OtelSample DB + schema, then exits
#   api            — .NET API (containerised, avoids macOS ARM64 SqlClient issue)
#   sqlserver      — SQL Server 2022 (app database)
#   prometheus     — Prometheus scraping /metrics from the API container
#   grafana        — Grafana with pre-provisioned dashboard
#   otel-collector — OTel Collector (receives OTLP; useful for AWS mode testing locally)
#
# Run with:
#   podman compose up -d --build

services:

  # ── DB initialiser ───────────────────────────────────────────────────────
  # WHY separate container: azure-sql-edge does not ship sqlcmd, so there is
  # no in-image mechanism to run init SQL. This one-shot Python container
  # connects to master, creates the OtelSample database and Orders table
  # (both idempotent), then exits. The api waits for it via
  # service_completed_successfully so it always starts with a ready schema.
  # db-init:
  #   build:
  #     context: docker/db-init
  #   container_name: otelsample-db-init
  #   environment:
  #     DB_HOST: sqlserver
  #     DB_PASSWORD: "YourStrong@Passw0rd"
  #   depends_on:
  #     sqlserver:
  #       condition: service_healthy
  #   restart: "no"

  # ── .NET API ────────────────────────────────────────────────────────────
  # WHY containerised: Microsoft.Data.SqlClient 6.x hits a macOS ARM64
  # SocketException during TDS pre-login. Running inside a Linux container
  # avoids this entirely and better represents production (ECS/K8s).
  api:
    build:
      context: .
      dockerfile: src/OtelSample.Api/Dockerfile
    container_name: otelsample-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Override the connection string so the container reaches sqlserver
      # by Docker service name instead of localhost.
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=OtelSample;User Id=sa;Password=${DB_PASSWD};TrustServerCertificate=True;"
      # OTel Collector endpoint (container-to-container)
      Otel__OtlpEndpoint: "http://otel-collector:4317"
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      # db-init:
      #   condition: service_completed_successfully

  # ── SQL Server ────────────────────────────────────────────────────────────
  # WHY azure-sql-edge: mssql/server is x86-64 only and either segfaults or
  # crawls under QEMU on Apple Silicon. azure-sql-edge ships a native ARM64
  # image and is T-SQL compatible for local development.
  # On x86-64 Linux/Windows, swap to mcr.microsoft.com/mssql/server:2022-latest.
  sqlserver:
    #image: mcr.microsoft.com/azure-sql-edge:latest
    build: ./db
    container_name: otelsample-sqlserver
    #platform: linux/arm64
    environment:
    #    DB_PASSWD: ${DB_PASSWD}
        SA_PASSWORD: ${DB_PASSWD}
    #   ACCEPT_EULA: "Y"
    #   MSSQL_PID: "Developer"
    ports:
      - "2433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # TCP check: azure-sql-edge does not ship sqlcmd, so verify the TDS
      # port (1433) is accepting connections. Bash required for /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: otelsample-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - api

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: otelsample-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ── OTel Collector ────────────────────────────────────────────────────────
  # Useful for testing AWS mode locally: set Otel:Mode=aws in appsettings and
  # the app will push OTLP to this collector on port 4317.
  # In production, replace with the ADOT Collector sidecar on ECS.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otelsample-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector self-metrics (telemetry.metrics reader)
      - "8889:8889"   # Prometheus exporter for pipeline metrics
    depends_on:
      - prometheus

volumes:
  sqlserver-data:
  grafana-data:
